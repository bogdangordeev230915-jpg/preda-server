<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PrēDa</title>
  <style>
    *{box-sizing:border-box}
    :root{--brown:#74452f;--brown2:#8a563c;--cream:#f7f1eb;--line:#e5ddd6;--text:#211b18;--muted:#8b7d74;--green:#25a35a}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#5d3828,#9a674c);color:var(--text);min-height:100vh}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
    .card{width:min(520px,100%);background:#fffdfb;border-radius:34px;padding:34px 28px;box-shadow:0 20px 70px #0005}
    .logo{width:108px;height:108px;margin:0 auto 24px;border-radius:30px;background:var(--brown);color:white;display:grid;place-items:center;font-size:58px;font-weight:800}
    h1{text-align:center;font-size:46px;margin:0 0 6px;letter-spacing:-2px}
    .subtitle{text-align:center;color:var(--muted);font-size:20px;margin-bottom:28px}
    label{display:block;font-weight:700;font-size:18px;margin:16px 0 8px}
    input,textarea{width:100%;border:2px solid var(--line);border-radius:18px;padding:16px;background:white;outline:none}
    input:focus,textarea:focus{border-color:var(--brown2);box-shadow:0 0 0 4px #8a563c18}
    textarea{min-height:110px;resize:vertical}
    .primary{width:100%;border:0;border-radius:18px;padding:17px;background:var(--brown);color:white;font-size:19px;font-weight:800;margin-top:22px}
    .secondary{width:100%;border:0;background:transparent;color:var(--brown);font-weight:800;padding:18px}
    .error,.ok{padding:14px 16px;border-radius:16px;margin:14px 0;font-weight:700}
    .error{background:#fff0ef;color:#a52c27}.ok{background:#eaf8ef;color:#187a40}
    .hidden{display:none!important}
    .app{height:100vh;display:flex;background:#f6f0ea}
    .sidebar{width:360px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
    .top{padding:18px;background:var(--brown);color:white}
    .brand{font-size:30px;font-weight:900;margin-bottom:15px}
    .search{display:flex;gap:8px}
    .search input{padding:12px;border:0;border-radius:14px}
    .search button{border:0;border-radius:14px;background:#fff;color:var(--brown);padding:0 15px;font-weight:800}
    .tabs{display:flex;border-bottom:1px solid var(--line)}
    .tab{flex:1;border:0;background:white;padding:15px 5px;font-weight:800;color:var(--muted)}
    .tab.active{color:var(--brown);border-bottom:3px solid var(--brown)}
    .list{overflow:auto;flex:1}
    .item{padding:16px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;cursor:pointer}
    .item:hover{background:#faf7f4}
    .avatar{width:48px;height:48px;border-radius:50%;background:var(--brown);color:white;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .item strong{display:block}.item small{color:var(--muted)}
    .chat{flex:1;display:flex;flex-direction:column;min-width:0}
    .chatHead{padding:16px 20px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    .messages{flex:1;overflow:auto;padding:24px;background:linear-gradient(#f8f2ec,#eee4da)}
    .bubble{max-width:min(75%,600px);padding:11px 14px;margin:8px 0;border-radius:18px;background:white;box-shadow:0 2px 7px #0000000d}
    .bubble.mine{margin-left:auto;background:#dff3e5}
    .composer{display:flex;gap:8px;padding:12px;background:white;border-top:1px solid var(--line)}
    .composer input{flex:1}
    .composer button{border:0;border-radius:15px;padding:0 17px;background:var(--brown);color:white;font-weight:800}
    .empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
    .modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}
    .modalBox{width:min(500px,100%);background:white;border-radius:25px;padding:25px}
    .row{display:flex;gap:10px}
    .row>*{flex:1}
    .close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px}
    @media(max-width:760px){
      .sidebar{width:100%}.chat{display:none}
      .app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}
      .screen{padding:12px}.card{border-radius:25px;padding:28px 20px}
      h1{font-size:40px}
    }
  </style>
</head>
<body>

<div id="auth" class="screen">
  <div class="card">
    <div class="logo">P</div>
    <h1>PrēDa</h1>
    <div id="authSubtitle" class="subtitle">Создайте свой аккаунт</div>
    <div id="authError" class="error hidden"></div>

    <div id="registerFields">
      <label>Имя</label>
      <input id="name" placeholder="Ваше имя" maxlength="100">

      <label>О себе</label>
      <textarea id="bio" placeholder="Расскажите о себе"></textarea>
    </div>

    <label>Код PrēDa</label>
    <input id="loginCode" placeholder="PD-XXXXXXXXXX">

    <label>Пароль</label>
    <input id="password" type="password" placeholder="Пароль">

    <button id="authButton" class="primary">Создать аккаунт</button>
    <button id="switchAuth" class="secondary">Уже есть аккаунт? Войти</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="top">
      <div class="brand">PrēDa</div>
      <div class="search">
        <input id="userSearch" placeholder="Найти по PD-коду">
        <button onclick="findUser()">Найти</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="contacts">Контакты</button>
      <button class="tab" data-tab="groups">Группы</button>
      <button class="tab" data-tab="channels">Каналы</button>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <main class="chat">
    <div id="chatHead" class="chatHead">
      <div class="empty">Выберите контакт, чтобы начать общение</div>
    </div>
    <div id="messages" class="messages">
      <div class="empty">PrēDa — ваш мессенджер</div>
    </div>
    <form id="composer" class="composer hidden">
      <input id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
      <button>Отправить</button>
    </form>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle">Пользователь</h2>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API = location.origin;
let token = localStorage.getItem('preda_token');
let me = null;
let currentChat = null;
let currentUser = null;
let ws = null;
let registerMode = true;

const $ = id => document.getElementById(id);

function showError(message){
  $('authError').textContent = message;
  $('authError').classList.remove('hidden');
}
function clearError(){ $('authError').classList.add('hidden'); }

async function api(path, options={}){
  const headers = {'Content-Type':'application/json', ...(options.headers||{})};
  if(token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, {...options, headers});
  let data = {};
  try { data = await res.json(); } catch {}
  if(!res.ok) throw new Error(data.error || data.message || 'Ошибка сервера');
  return data;
}

$('switchAuth').onclick = () => {
  registerMode = !registerMode;
  $('registerFields').classList.toggle('hidden', !registerMode);
  $('loginCode').classList.toggle('hidden', registerMode);
  $('authSubtitle').textContent = registerMode ? 'Создайте свой аккаунт' : 'Войдите в PrēDa';
  $('authButton').textContent = registerMode ? 'Создать аккаунт' : 'Войти';
  $('switchAuth').textContent = registerMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Создать';
  clearError();
};

$('authButton').onclick = async () => {
  clearError();
  try{
    if(registerMode){
      const name = $('name').value.trim();
      const bio = $('bio').value.trim();
      const password = $('password').value;
      if(!name || password.length < 6) throw new Error('Введите имя и пароль минимум из 6 символов');
      const data = await api('/api/auth/register',{
        method:'POST',
        body:JSON.stringify({name,bio,password})
      });
      token = data.token;
      localStorage.setItem('preda_token',token);
    }else{
      const publicCode = $('loginCode').value.trim().toUpperCase();
      const password = $('password').value;
      const data = await api('/api/auth/login',{
        method:'POST',
        body:JSON.stringify({publicCode,password})
      });
      token = data.token;
      localStorage.setItem('preda_token',token);
    }
    await startApp();
  }catch(e){ showError(e.message); }
};

async function startApp(){
  try{
    me = await api('/api/me');
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    connectWS();
    loadContacts();
  }catch(e){
    token = null;
    localStorage.removeItem('preda_token');
    $('auth').classList.remove('hidden');
    $('app').classList.add('hidden');
    showError(e.message);
  }
}

async function loadContacts(){
  const list = $('list');
  try{
    const data = await api('/api/contacts');
    const contacts = data.contacts || data || [];
    if(!contacts.length){
      list.innerHTML = '<div class="empty">Контактов пока нет.<br>Используйте поиск по PD-коду.</div>';
      return;
    }
    list.innerHTML = contacts.map(c => `
      <div class="item" onclick="openChat(${Number(c.id || c.user_id)})">
        <div class="avatar">${avatarHTML(c)}</div>
        <div><strong>${esc(c.name || 'Пользователь')}</strong><small>${esc(c.public_code || '')}</small></div>
      </div>
    `).join('');
  }catch(e){
    list.innerHTML = '<div class="empty">Не удалось загрузить контакты</div>';
  }
}

function avatarHTML(u){
  return u.avatar_url ? `<img src="${escAttr(u.avatar_url)}">` : esc((u.name||'P')[0].toUpperCase());
}

async function findUser(){
  const code = $('userSearch').value.trim().toUpperCase();
  if(!code) return;
  try{
    const u = await api('/api/users/by-code/' + encodeURIComponent(code));
    $('modalTitle').textContent = u.name || 'Пользователь';
    $('modalBody').innerHTML = `
      <div class="avatar" style="width:90px;height:90px;margin:15px auto">${avatarHTML(u)}</div>
      <p><b>Код:</b> ${esc(u.public_code)}</p>
      <p>${esc(u.bio || 'Нет информации о себе')}</p>
      <button class="primary" onclick="addContact(${Number(u.id)})">Добавить в контакты</button>
      <button class="secondary" onclick="openChat(${Number(u.id)});closeModal()">Написать сообщение</button>
    `;
    $('modal').classList.remove('hidden');
  }catch(e){ alert(e.message); }
}

async function addContact(id){
  try{
    await api('/api/contacts/' + id,{method:'POST'});
    closeModal();
    await loadContacts();
    alert('Контакт добавлен');
  }catch(e){ alert(e.message); }
}

async function openChat(userId){
  try{
    const data = await api('/api/chats/direct/' + userId,{method:'POST'});
    currentChat = data.chatId || data.id || data.chat?.id;
    currentUser = data.user || await api('/api/users/' + userId).catch(()=>({id:userId,name:'Контакт'}));
    $('app').classList.add('chat-open');
    $('chatHead').innerHTML = `
      <button class="secondary" style="width:auto;padding:8px" onclick="closeChat()">←</button>
      <div class="avatar">${avatarHTML(currentUser)}</div>
      <div><strong>${esc(currentUser.name || 'Контакт')}</strong><small>${esc(currentUser.public_code || '')}</small></div>
    `;
    $('composer').classList.remove('hidden');
    await loadMessages();
  }catch(e){ alert(e.message); }
}

function closeChat(){
  $('app').classList.remove('chat-open');
  currentChat = null;
  $('composer').classList.add('hidden');
}

async function loadMessages(){
  if(!currentChat) return;
  try{
    const data = await api('/api/chats/' + currentChat + '/messages');
    const messages = data.messages || data || [];
    $('messages').innerHTML = messages.map(renderMessage).join('') || '<div class="empty">Напишите первое сообщение</div>';
    $('messages').scrollTop = $('messages').scrollHeight;
  }catch(e){
    $('messages').innerHTML = '<div class="empty">Не удалось загрузить сообщения</div>';
  }
}

function renderMessage(m){
  const mine = Number(m.sender_id) === Number(me?.id);
  return `<div class="bubble ${mine?'mine':''}">${esc(m.text || '')}</div>`;
}

$('composer').onsubmit = async e => {
  e.preventDefault();
  const text = $('messageInput').value.trim();
  if(!text || !currentChat) return;
  $('messageInput').value = '';
  try{
    const m = await api('/api/chats/' + currentChat + '/messages',{
      method:'POST',body:JSON.stringify({text,type:'text'})
    });
    const box = $('messages');
    if(box.querySelector('.empty')) box.innerHTML='';
    box.insertAdjacentHTML('beforeend',renderMessage(m.message || m));
    box.scrollTop = box.scrollHeight;
  }catch(e){ alert(e.message); }
};

function connectWS(){
  if(!token) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try{
    ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onmessage = e => {
      try{
        const data = JSON.parse(e.data);
        if(data.type === 'message' && data.message?.chat_id == currentChat){
          const box=$('messages');
          if(box.querySelector('.empty')) box.innerHTML='';
          box.insertAdjacentHTML('beforeend',renderMessage(data.message));
          box.scrollTop=box.scrollHeight;
        }
      }catch{}
    };
  }catch{}
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    const type=tab.dataset.tab;
    if(type==='contacts') loadContacts();
    else $('list').innerHTML='<div class="empty">'+(type==='groups'?'Группы скоро будут доступны.':'Каналы скоро будут доступны.')+'</div>';
  };
});

function closeModal(){ $('modal').classList.add('hidden'); }

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(v){ return esc(v); }

if(token) startApp();
else $('loginCode').classList.add('hidden');
</script>
</body>
</html>
